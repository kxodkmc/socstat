[package]
name = "socstat"
version = "0.1.0"
edition = "2024"
description = "A lightweight statistical analysis library for Rust — SPSS core capabilities as an embeddable SDK"
license = "MIT"
repository = "https://github.com/socstat/socstat"
keywords = ["statistics", "spss", "data-analysis", "analytics"]
categories = ["science", "mathematics"]

[features]
default = ["csv"]
csv = ["dep:csv", "dep:serde_json"]
sav = ["dep:flate2"]
# `excel` and `datetime` were removed (Hard Rule 3: no fake feature claims)
# until `src/io/excel.rs` and a datetime module are actually implemented.
full = ["csv", "sav"]

[dependencies]
# Core (always required)
nalgebra = "0.35"
statrs = "0.19"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Optional (feature-gated)
csv = { version = "1.3", optional = true }
serde_json = { version = "1.0", optional = true }
flate2 = { version = "1.0", optional = true }

[dev-dependencies]
approx = "0.5"
serde_json = "1.0"

[profile.release]
opt-level = 3
