[package]
name = "socstat"
version = "0.1.0"
edition = "2024"
description = "A lightweight statistical analysis library for Rust — SPSS core capabilities as an embeddable SDK"
license = "MIT"
repository = "https://github.com/socstat/socstat"
keywords = ["statistics", "spss", "data-analysis", "analytics"]
categories = ["science", "mathematics"]

[features]
default = ["csv"]
csv = ["dep:csv", "dep:serde_json"]
excel = ["dep:calamine", "dep:rust_xlsxwriter"]
datetime = ["dep:chrono"]
sav = ["dep:flate2"]
full = ["csv", "excel", "datetime", "sav"]

[dependencies]
# Core (always required)
nalgebra = "0.35"
statrs = "0.19"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Optional (feature-gated)
csv = { version = "1.3", optional = true }
serde_json = { version = "1.0", optional = true }
calamine = { version = "0.36", optional = true }
rust_xlsxwriter = { version = "0.97", optional = true }
chrono = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }

[dev-dependencies]
approx = "0.5"
serde_json = "1.0"

[profile.release]
opt-level = 3
